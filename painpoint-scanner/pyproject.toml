[project]
name = "painpoint-scanner"
version = "0.1.0"
description = "Sweep Reddit for problems worth building software against."
requires-python = ">=3.10"
dependencies = [
    "praw>=7.7,<8",
    "anthropic>=1.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
mcp = ["mcp>=2.0"]
embeddings = ["openai>=1.0"]

[project.scripts]
painpoint = "painpoint.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["painpoint*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:painpoint.*"]
